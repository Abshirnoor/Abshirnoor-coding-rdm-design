<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Abshir Noor, web developer and designer from Somalia. A personal site with a new randomly generated design on every visit.">
  <title>Abshir Noor | Web Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=DM+Serif+Display&family=Inter:wght@400;600&family=Noto+Sans&family=Playfair+Display:wght@500&family=Space+Grotesk:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="dist/style.css">
</head>
<body>
  <div class="stage">
    <header class="header">
      <div class="logo">Abshirnoor</div>
      <button type="button" class="nav-btn" aria-label="Generate a new design" title="Generate a new design (or press Space)">
        <svg class="nav-btn__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 30" aria-hidden="true">
          <rect class="nav-rect" width="40" height="2" x="8" y="8" />
          <rect class="nav-rect" width="40" height="2" x="8" y="14" />
          <rect width="40" height="2" x="8" y="20" />
        </svg>
      </button>
    </header>

    <main class="intro" id="slide-0">
      <div class="intro__content">
        <h1 class="intro__title">Hi!</h1>
        <p class="intro__txt">I'm Abshir, a web developer and graphic designer from Somalia. I'm ambitious, patient and determined, always learning something new, and I work well under pressure.</p>
        <p class="intro__meta">Design <span class="design-name"></span> · click the menu or press <kbd>Space</kbd> for a new one</p>
      </div>
      <img class="intro__img" src="images/pic1.jpeg" alt="Portrait of Abshir Noor" width="480" height="640">
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
